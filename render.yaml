# Render Blueprint: New → Blueprint → pick this repo. Fill the `sync: false` variables in the dashboard.
services:
  - type: web
    name: wishlist-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: AUTO_SETUP_BOT
        value: "1"
      - key: WEBAPP_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BOT_USERNAME
        value: wish_and_gift_bot
      - key: APP_SHORT_NAME
        value: wishlist
